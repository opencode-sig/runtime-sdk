syntax = "proto3";

package user.v1;

option go_package = "github.com/opencode-sig/runtime-sdk/examples/go-template-payment/protobuf/user/v1;userv1";

service UserService {
  rpc GetUser(GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  string id = 1;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string status = 4;
}
